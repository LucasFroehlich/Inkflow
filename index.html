<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INKFLOW</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f8;color:#172b49;font:16px system-ui}header,main{max-width:1000px;margin:auto;padding:20px}header{font-size:25px;font-weight:800}section{background:white;border-radius:16px;padding:20px;margin-bottom:16px}textarea{width:100%;min-height:150px;padding:12px;font:inherit;border:1px solid #bac8db;border-radius:8px}button,select,input{font:inherit;margin:5px;padding:9px}button{background:#244c91;color:white;border:0;border-radius:8px}svg{width:100%;height:auto;background:white;display:block;margin-bottom:16px}canvas{touch-action:none;border:1px solid #abc;width:240px;height:120px}@media print{header,.controls{display:none}body,main,section{margin:0;padding:0;background:white}svg{width:210mm;height:297mm;break-after:page;margin:0}@page{size:A4;margin:0}}</style><header>INKFLOW · Schriftstudio</header><main><section class="controls"><h2>Text eingeben</h2><textarea id="t">Willkommen bei Inkflow.</textarea><input type="file" id="file" accept=".txt,.pdf"><label>Papier <select id="paper"><option value="line">Liniert</option><option value="grid">Kariert</option><option value="blank">Weiß</option></select></label><label>Größe <input id="size" type="number" min="10" max="40" value="22"></label><button id="render">Erstellen</button><button onclick="print()">PDF / Goodnotes</button><button id="download">SVG exportieren</button><p id="status">Demoschrift, bis du eigene Zeichen zeichnest.</p><details><summary>Eigene Handschrift erfassen</summary><p>Zeichne einzelne Zeichen mit dem Apple Pencil. Die Pfade bleiben lokal auf deinem Gerät.</p><input id="letter" maxlength="1" value="a" size="2"><canvas id="pad" width="480" height="240"></canvas><button id="clear">Neu zeichnen</button><button id="save">Zeichen speichern</button></details></section><section id="out"></section></main><script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let glyphs={};try{glyphs=JSON.parse(localStorage.getItem('inkflow-glyphs')||'{}')}catch(e){};let strokes=[],active=null;const c=$('pad'),ctx=c.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#164ba0';function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*480/r.width,(e.clientY-r.top)*240/r.height]}c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);active=[point(e)];strokes.push(active)};c.onpointermove=e=>{if(!active)return;let p=point(e),q=active[active.length-1];ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(...p);ctx.stroke();active.push(p)};c.onpointerup=c.onpointercancel=()=>active=null;$('clear').onclick=()=>{strokes=[];ctx.clearRect(0,0,480,240)};$('save').onclick=()=>{let k=$('letter').value;if(!k||!strokes.length)return;let pts=strokes.flat(),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys),h=Math.max(1,Math.max(...ys)-y),w=Math.max(...xs)-x;glyphs[k]={w:w/h,d:strokes.map(s=>s.map((p,i)=>(i?'L':'M')+((p[0]-x)/h).toFixed(3)+' '+((p[1]-y)/h).toFixed(3)).join(' ')).join(' ')};try{localStorage.setItem('inkflow-glyphs',JSON.stringify(glyphs))}catch(e){$('status').textContent='Lokales Speichern nicht möglich.'}draw()};function el(tag,a,parent){let n=document.createElementNS(ns,tag);for(let k in a)n.setAttribute(k,a[k]);parent.appendChild(n);return n}function draw(){let out=$('out');out.replaceChildren();let z=Math.max(10,Math.min(40,Number($('size').value)||22)),step=z*1.7,s,x,y;function page(){s=el('svg',{xmlns:ns,viewBox:'0 0 794 1123'},out);el('rect',{width:794,height:1123,fill:'white'},s);let p=$('paper').value;if(p!=='blank')for(let j=55;j<1090;j+=step)el('line',{x1:35,x2:759,y1:j,y2:j,stroke:'#d8e5f4'},s);if(p==='grid')for(let j=35;j<760;j+=step)el('line',{x1:j,x2:j,y1:35,y2:1090,stroke:'#d8e5f4'},s);x=50;y=55}function next(){x=50;y+=step;if(y>1070)page()}function width(k){return k===' '?z*.35:glyphs[k]?z*(glyphs[k].w+.12):z*.58}page();for(let word of $('t').value.split(/(\s+)/)){if(!word)continue;if(word.includes('\n')){for(let k of word){if(k==='\n')next();else x+=width(k)}continue}let w=[...word].reduce((a,k)=>a+width(k),0);if(x+w>744&&x>50)next();for(let k of word){let a=width(k);if(x+a>744)next();if(k!==' '){let g=glyphs[k];if(g)el('path',{d:g.d,transform:'translate('+x+' '+(y-z)+') scale('+z+')',fill:'none',stroke:'#164ba0','stroke-width':.035,'stroke-linecap':'round','stroke-linejoin':'round'},s);else el('text',{x,y,fill:'#164ba0','font-size':z,'font-family':'cursive','font-style':'italic'},s).textContent=k}x+=a}}$('status').textContent=Object.keys(glyphs).length+' eigene Zeichen · übrige Zeichen in Demoschrift · '+out.children.length+' Seite(n)'}$('render').onclick=draw;for(let id of ['t','size','paper'])$(id).addEventListener('input',draw);$('download').onclick=()=>{for(let [i,s] of [...$('out').children].entries()){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}));a.download='inkflow-'+(i+1)+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}};$('file').onchange=async()=>{let f=$('file').files[0];if(!f)return;try{if(f.name.toLowerCase().endsWith('.pdf')){let pdf=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs');pdf.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';let d=await pdf.getDocument({data:await f.arrayBuffer()}).promise,parts=[];for(let i=1;i<=d.numPages;i++){let p=await d.getPage(i),v=await p.getTextContent();parts.push(v.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''))}$('t').value=parts.join('\n\n');if(!$('t').value.trim())throw Error('PDF enthält keinen erkennbaren Text.')}else $('t').value=await f.text();draw()}catch(e){$('status').textContent=e.message}};draw();</script></html>
